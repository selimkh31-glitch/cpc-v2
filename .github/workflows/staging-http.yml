name: staging-http (G2, manuel)

# Contrôles HTTP réels sur le staging CPC V2 (C-1, isolation, D-40, Storage).
# Déclenchement MANUEL uniquement ; aucune exécution sur push ou PR.
# Secrets requis dans l'environnement « staging-qa » (Settings → Environments), jamais dans Git :
#   STAGING_SUPABASE_URL, STAGING_PUBLISHABLE_KEY, QA_A_EMAIL, QA_A_PASSWORD, QA_B_EMAIL, QA_B_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-http
  cancel-in-progress: false

jobs:
  staging-http:
    name: staging-http (Supabase staging, HTTP réel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets stockés dans l'environnement « staging-qa », restreint à la branche main :
    # aucune autre branche, PR ou fork ne peut y accéder.
    environment: staging-qa
    env:
      E2E_TARGET: staging
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
      QA_A_EMAIL: ${{ secrets.QA_A_EMAIL }}
      QA_A_PASSWORD: ${{ secrets.QA_A_PASSWORD }}
      QA_B_EMAIL: ${{ secrets.QA_B_EMAIL }}
      QA_B_PASSWORD: ${{ secrets.QA_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Garde-fous (branche main, cible staging CPC V2)
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Exécution autorisée uniquement depuis main"; exit 1; }
          # Normalisation (espaces, retours à la ligne, « / » final) puis diagnostic SANS afficher la valeur.
          norm=$(printf '%s' "$STAGING_SUPABASE_URL" | tr -d '[:space:]' | sed 's#/*$##')
          if [ "$norm" != "https://cglbsllwdmluvbisozyx.supabase.co" ]; then
            if [ -z "$STAGING_SUPABASE_URL" ]; then why="secret absent ou vide (environnement staging-qa ?)";
            elif printf '%s' "$norm" | grep -q 'cglbsllwdmluvbisozyx'; then why="référence correcte mais format inattendu (http, chemin…)";
            else why="valeur différente du staging CPC V2"; fi
            echo "::error title=Garde-fou cible::Cible non autorisée : $why"; exit 1
          fi
          [ "$norm" = "$STAGING_SUPABASE_URL" ] || echo "::notice title=Garde-fou cible::URL normalisée (espaces ou « / » final retirés)"
          echo "STAGING_SUPABASE_URL=$norm" >> "$GITHUB_ENV"
          for v in STAGING_PUBLISHABLE_KEY QA_A_EMAIL QA_A_PASSWORD QA_B_EMAIL QA_B_PASSWORD; do
            [ -n "$(printf '%s' "${!v}" | tr -d '[:space:]')" ] || { echo "::error title=Secrets::$v absent ou vide"; exit 1; }
          done
          for v in QA_A_EMAIL QA_B_EMAIL; do
            e=$(printf '%s' "${!v}" | tr -d '[:space:]')
            case "$e" in *=*) echo "::error title=Secrets::$v contient « = » (nom de variable collé avec la valeur ?)"; exit 1;; esac
            case "$e" in qa_*@example.test) ;; *) echo "::error title=Secrets::$v n'est pas un compte synthétique qa_*@example.test (valeur non affichée)"; exit 1;; esac
            [ "$e" = "${!v}" ] || echo "::notice title=Secrets::$v contenait des espaces ou retours à la ligne (retirés)"
          done
      - name: Tests HTTP (API uniquement, sans navigateur)
        run: pnpm exec playwright test --project staging-http --workers=1 --reporter=json > playwright-staging.json
      - if: always()
        run: node scripts/ci/annotate.mjs playwright playwright-staging.json
